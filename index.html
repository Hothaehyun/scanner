<title>포켓 스캐너</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* 한 손 조작용 단일 컬럼: 페이지 모음 → 모서리 맞추기 → 보정 → 내보내기 */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --fg:#12171E; --muted:#5B6672; --line:#D2D9E0;
  --accent:#0B7A6C; --accent-fg:#FFFFFF; --danger:#B3261E;
  --ui:'Schibsted Grotesk',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1318; --surface:#171E26; --fg:#E8EDF2; --muted:#8F9BA8; --line:#2A333D;
    --accent:#38D3BC; --accent-fg:#06211C; --danger:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1318; --surface:#171E26; --fg:#E8EDF2; --muted:#8F9BA8; --line:#2A333D;
  --accent:#38D3BC; --accent-fg:#06211C; --danger:#FF8A80; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--ui); font-size:16px; line-height:1.5;
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
.app{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
.view{display:flex; flex-direction:column; gap:16px; min-width:0}
.top{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
h1{font-size:1.6rem; font-weight:800; letter-spacing:-.02em; margin:0; text-wrap:balance}
.tag{font-family:var(--mono); font-size:.75rem; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
p{margin:0}
.hint{color:var(--muted); font-size:.9rem}
.btn{
  appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--fg);
  font:600 1rem var(--ui); min-height:48px; padding:0 18px; border-radius:12px;
  display:inline-flex; align-items:center; justify-content:center; text-align:center; cursor:pointer;
}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-fg)}
.btn:focus-visible,.chip:focus-visible,.del:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.btn:disabled{opacity:.5}
.row{display:flex; gap:10px; flex-wrap:wrap}
.row>.btn{flex:1 1 130px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.empty{border:1.5px dashed var(--line); border-radius:12px; padding:20px 18px; display:flex; flex-direction:column; gap:10px}
.empty ol{margin:0; padding-left:1.2em; display:flex; flex-direction:column; gap:4px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px}
.pg{position:relative; margin:0; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:6px; min-width:0}
.pg img{display:block; width:100%; height:auto; border-radius:4px}
.pg .n{position:absolute; left:10px; bottom:10px; font-family:var(--mono); font-size:.7rem; background:var(--fg); color:var(--bg); padding:1px 6px; border-radius:4px}
.del{
  position:absolute; top:-8px; right:-8px; width:32px; height:32px; border-radius:50%;
  border:1px solid var(--line); background:var(--surface); color:var(--danger); font:700 1rem var(--ui); cursor:pointer;
}
.stage{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px; display:flex; justify-content:center; overflow:hidden}
.stage canvas{display:block; touch-action:none}
.fxbox canvas{width:auto; height:auto; max-width:100%; max-height:66vh; display:block}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{
  appearance:none; font:600 .95rem var(--ui); min-height:40px; padding:0 14px; border-radius:20px;
  border:1px solid var(--line); background:var(--surface); color:var(--fg); cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-fg)}
.eng{font-family:var(--mono); font-size:.75rem; color:var(--muted)}
.out img{display:block; width:100%; height:auto; border:1px solid var(--line); border-radius:6px; background:#fff}
.out figure{margin:0; display:flex; flex-direction:column; gap:6px}
.out figcaption{font-family:var(--mono); font-size:.75rem; color:var(--muted)}
.toast{
  position:fixed; left:50%; transform:translateX(-50%); z-index:20; max-width:calc(100% - 32px);
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:.9rem; text-align:center;
}
</style>

<div class="app">

  <section class="view" id="v-home">
    <div class="top"><h1>포켓 스캐너</h1><span class="tag" id="count">0 pages</span></div>
    <div id="empty" class="empty">
      <p><strong>종이를 책상에 놓고 한 장씩 찍으세요.</strong></p>
      <ol class="hint">
        <li>촬영하거나 사진을 고릅니다.</li>
        <li>네 모서리를 문서 끝에 맞춥니다.</li>
        <li>선명·흑백 중 보정을 고릅니다.</li>
      </ol>
    </div>
    <div class="grid" id="grid" hidden></div>
    <div class="row">
      <label class="btn primary" for="file" id="addBtn">문서 촬영 / 사진 선택</label>
      <button class="btn" id="toOut" disabled>PDF · 이미지 내보내기</button>
    </div>
    <input class="sr" type="file" id="file" accept="image/*">
    <p class="hint">이 화면을 닫으면 스캔한 페이지가 사라집니다. 내보내기까지 마친 뒤에 닫으세요.</p>
  </section>

  <section class="view" id="v-crop" hidden>
    <div class="top"><h1>모서리 맞추기</h1><span class="tag">step 1 / 2</span></div>
    <div class="stage" id="stage"><canvas id="cropCv"></canvas></div>
    <p class="eng" id="eng">모서리 네 점을 손가락으로 끌어 맞추세요. 자동 감지는 버튼을 누르면 켜집니다.</p>
    <div class="row">
      <button class="btn" id="auto">자동 감지</button>
      <button class="btn" id="whole">전체 선택</button>
    </div>
    <div class="row">
      <button class="btn" id="cropBack">취소</button>
      <button class="btn primary" id="cropNext">다음</button>
    </div>
  </section>

  <section class="view" id="v-fx" hidden>
    <div class="top"><h1>보정</h1><span class="tag">step 2 / 2</span></div>
    <div class="stage fxbox" id="fxHost"></div>
    <div class="chips" id="chips">
      <button class="chip" data-m="color" aria-pressed="false">원본색</button>
      <button class="chip" data-m="sharp" aria-pressed="true">선명</button>
      <button class="chip" data-m="gray" aria-pressed="false">회색조</button>
      <button class="chip" data-m="bw" aria-pressed="false">흑백 문서</button>
    </div>
    <div class="row">
      <button class="btn" id="rotL">왼쪽 회전</button>
      <button class="btn" id="rotR">오른쪽 회전</button>
    </div>
    <div class="row">
      <button class="btn" id="fxBack">다시 자르기</button>
      <button class="btn primary" id="fxAdd">페이지에 추가</button>
    </div>
  </section>

  <section class="view" id="v-out" hidden>
    <div class="top"><h1>내보내기</h1><span class="tag" id="outCount"></span></div>
    <div class="row">
      <button class="btn primary" id="pdfBtn">PDF 만들기</button>
      <button class="btn" id="outBack">돌아가기</button>
    </div>
    <p class="hint">PDF가 저장되지 않으면 아래 이미지를 길게 눌러 &lsquo;사진에 추가&rsquo;를 고르세요.</p>
    <div class="out" id="outList" style="display:flex;flex-direction:column;gap:16px"></div>
  </section>

</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const views = {home:$('#v-home'), crop:$('#v-crop'), fx:$('#v-fx'), out:$('#v-out')};
let current = 'home';
function show(n){ current = n; for (const k in views) views[k].hidden = k !== n; window.scrollTo(0,0); }
let toastTimer;
function toast(msg, ms = 2600){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const dist = (p,q) => Math.hypot(p[0]-q[0], p[1]-q[1]);
const nextFrame = () => new Promise(r => setTimeout(r, 30));

const pages = [];            // {canvas, thumb}
let src = null;              // 원본 사진(축소본) canvas
let quad = [];               // [tl,tr,br,bl] 원본 좌표
let base = null;             // 펴진 문서 canvas(원본색)
let mode = 'sharp';
let fxResult = null;

/* ---------- 홈 ---------- */
function renderHome(){
  const grid = $('#grid');
  grid.innerHTML = '';
  pages.forEach((p,i) => {
    const f = document.createElement('figure'); f.className = 'pg';
    const im = new Image(); im.src = p.thumb; im.alt = (i+1) + '쪽';
    const n = document.createElement('span'); n.className = 'n'; n.textContent = 'P' + (i+1);
    const d = document.createElement('button'); d.className = 'del'; d.dataset.i = i; d.textContent = '×'; d.setAttribute('aria-label', (i+1) + '쪽 삭제');
    f.append(im, n, d); grid.append(f);
  });
  grid.hidden = !pages.length;
  $('#empty').hidden = pages.length > 0;
  $('#toOut').disabled = !pages.length;
  $('#count').textContent = pages.length + ' page' + (pages.length === 1 ? '' : 's');
}
$('#grid').addEventListener('click', e => {
  const b = e.target.closest('.del'); if (!b) return;
  pages.splice(+b.dataset.i, 1); renderHome();
});

/* ---------- 사진 불러오기 ---------- */
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const url = URL.createObjectURL(f);
    const img = new Image();
    await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
    const k = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
    src = document.createElement('canvas');
    src.width = Math.round(img.naturalWidth * k); src.height = Math.round(img.naturalHeight * k);
    src.getContext('2d').drawImage(img, 0, 0, src.width, src.height);
    URL.revokeObjectURL(url);
  } catch (err) { toast('사진을 열 수 없습니다. 다른 사진으로 시도하세요.'); return; }
  quad = insetQuad(0.06);
  show('crop'); layoutCrop();
  if (cvReady) runAuto(true);
});

/* ---------- 모서리 맞추기 ---------- */
const cropCv = $('#cropCv');
let cropScale = 1, dpr = 1, drag = -1;
function insetQuad(m){
  const w = src.width, h = src.height, x = w*m, y = h*m;
  return [[x,y],[w-x,y],[w-x,h-y],[x,h-y]];
}
function layoutCrop(){
  const cw = $('#stage').clientWidth - 18;
  const maxH = Math.max(260, innerHeight * 0.62);
  cropScale = Math.min(cw / src.width, maxH / src.height);
  const cssW = Math.round(src.width * cropScale), cssH = Math.round(src.height * cropScale);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cropCv.width = Math.round(cssW * dpr); cropCv.height = Math.round(cssH * dpr);
  cropCv.style.width = cssW + 'px'; cropCv.style.height = cssH + 'px';
  drawCrop();
}
function drawCrop(){
  const c = cropCv, ctx = c.getContext('2d'), k = c.width / src.width;
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#0B7A6C';
  ctx.clearRect(0,0,c.width,c.height);
  ctx.drawImage(src, 0, 0, c.width, c.height);
  ctx.beginPath(); ctx.rect(0,0,c.width,c.height);
  quad.forEach((q,i) => i ? ctx.lineTo(q[0]*k, q[1]*k) : ctx.moveTo(q[0]*k, q[1]*k));
  ctx.closePath(); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fill('evenodd');
  ctx.beginPath();
  quad.forEach((q,i) => i ? ctx.lineTo(q[0]*k, q[1]*k) : ctx.moveTo(q[0]*k, q[1]*k));
  ctx.closePath(); ctx.lineWidth = 2*dpr; ctx.strokeStyle = accent; ctx.stroke();
  quad.forEach(q => {
    ctx.beginPath(); ctx.arc(q[0]*k, q[1]*k, 12*dpr, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill();
    ctx.lineWidth = 3*dpr; ctx.strokeStyle = accent; ctx.stroke();
  });
}
function toSrc(e){
  const r = cropCv.getBoundingClientRect();
  return [(e.clientX - r.left) / cropScale, (e.clientY - r.top) / cropScale];
}
cropCv.addEventListener('pointerdown', e => {
  const p = toSrc(e); let bi = -1, bd = 1e9;
  quad.forEach((q,i) => { const d = Math.hypot((q[0]-p[0])*cropScale, (q[1]-p[1])*cropScale); if (d < bd){ bd = d; bi = i; } });
  if (bi >= 0){ drag = bi; cropCv.setPointerCapture(e.pointerId); e.preventDefault();
    quad[drag] = [clamp(p[0],0,src.width), clamp(p[1],0,src.height)]; drawCrop(); }
});
cropCv.addEventListener('pointermove', e => {
  if (drag < 0) return;
  const p = toSrc(e);
  quad[drag] = [clamp(p[0],0,src.width), clamp(p[1],0,src.height)];
  drawCrop();
});
['pointerup','pointercancel'].forEach(t => cropCv.addEventListener(t, () => { drag = -1; }));
window.addEventListener('resize', () => { if (current === 'crop' && src) layoutCrop(); });

$('#whole').onclick = () => { quad = insetQuad(0); drawCrop(); };
$('#cropBack').onclick = () => show('home');
$('#auto').onclick = () => {
  if (!cvReady) {
    if (engineState === 'fail') { toast('자동 감지를 쓸 수 없습니다. 모서리를 직접 맞추세요.'); return; }
    ensureCV(); toast('엔진을 불러옵니다. 끝나면 자동으로 감지합니다.'); return;
  }
  runAuto(false);
};
$('#cropNext').onclick = async () => {
  toast('문서를 펴는 중…', 0); await nextFrame();
  base = warp(); mode = 'sharp'; renderFx(); show('fx'); $('#toast').hidden = true;
};

/* ---------- 자동 감지 (OpenCV, 선택 기능) ---------- */
let cvReady = false, cvLoading = false, engineState = 'idle';
function setEngine(s){
  engineState = s;
  $('#eng').textContent = {
    loading:'자동 감지 엔진 불러오는 중… (처음 한 번, 약 10MB)',
    ready:'자동 감지 준비됨', fail:'자동 감지 엔진을 불러오지 못했습니다. 모서리를 직접 맞추세요.',
    idle:'모서리 네 점을 손가락으로 끌어 맞추세요. 자동 감지는 버튼을 누르면 켜집니다.'
  }[s];
}
function ensureCV(){
  if (cvReady || cvLoading) return;
  cvLoading = true; setEngine('loading');
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.9.0-release.1/dist/opencv.js';
  s.async = true;
  s.onload = () => {
    // cv 객체를 await 하면 무한 반복에 걸리므로, 준비 여부를 주기적으로 확인만 한다.
    let tries = 0;
    const wait = setInterval(() => {
      const c = window.cv;
      if (c && c.Mat && c.imread){
        clearInterval(wait); cvReady = true; setEngine('ready');
        if (current === 'crop' && src) runAuto(false);
      } else if (++tries > 120){ clearInterval(wait); setEngine('fail'); }
    }, 500);
  };
  s.onerror = () => setEngine('fail');
  document.head.appendChild(s);
}
function orderPts(pts){
  const sum = pts.map(p => p[0]+p[1]), dif = pts.map(p => p[1]-p[0]);
  return [pts[sum.indexOf(Math.min(...sum))], pts[dif.indexOf(Math.min(...dif))],
          pts[sum.indexOf(Math.max(...sum))], pts[dif.indexOf(Math.max(...dif))]];
}
function detect(){
  const s = Math.min(1, 600 / Math.max(src.width, src.height));
  const t = document.createElement('canvas');
  t.width = Math.round(src.width*s); t.height = Math.round(src.height*s);
  t.getContext('2d').drawImage(src, 0, 0, t.width, t.height);
  const m = cv.imread(t), g = new cv.Mat(), e = new cv.Mat(), k = cv.Mat.ones(5,5,cv.CV_8U);
  const cs = new cv.MatVector(), h = new cv.Mat();
  let best = null, bestA = 0;
  try {
    cv.cvtColor(m, g, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(g, g, new cv.Size(5,5), 0);
    cv.Canny(g, e, 60, 160);
    cv.dilate(e, e, k);
    cv.findContours(e, cs, h, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
    for (let i = 0; i < cs.size(); i++){
      const c = cs.get(i), a = cv.contourArea(c);
      if (a > bestA && a > t.width*t.height*0.15){
        const ap = new cv.Mat();
        cv.approxPolyDP(c, ap, 0.02*cv.arcLength(c, true), true);
        if (ap.rows === 4 && cv.isContourConvex(ap)){
          const d = ap.data32S;
          best = [[d[0],d[1]],[d[2],d[3]],[d[4],d[5]],[d[6],d[7]]]; bestA = a;
        }
        ap.delete();
      }
      c.delete();
    }
  } finally { m.delete(); g.delete(); e.delete(); k.delete(); cs.delete(); h.delete(); }
  return best ? orderPts(best).map(p => [p[0]/s, p[1]/s]) : null;
}
function runAuto(silent){
  try {
    const q = detect();
    if (q){ quad = q; drawCrop(); if (!silent) toast('문서 모서리를 찾았습니다.'); }
    else if (!silent) toast('문서 윤곽을 찾지 못했습니다. 모서리를 직접 맞추세요.');
  } catch (err) { if (!silent) toast('자동 감지에 실패했습니다. 모서리를 직접 맞추세요.'); }
}

/* ---------- 원근 보정(기울어진 사진을 반듯하게) ---------- */
function warp(){
  const [p0,p1,p2,p3] = quad;
  const W0 = Math.max(dist(p0,p1), dist(p3,p2)), H0 = Math.max(dist(p0,p3), dist(p1,p2));
  const k = Math.min(1, 1700 / Math.max(W0, H0));
  const W = Math.max(2, Math.round(W0*k)), H = Math.max(2, Math.round(H0*k));
  const dx1 = p1[0]-p2[0], dx2 = p3[0]-p2[0], dx3 = p0[0]-p1[0]+p2[0]-p3[0];
  const dy1 = p1[1]-p2[1], dy2 = p3[1]-p2[1], dy3 = p0[1]-p1[1]+p2[1]-p3[1];
  const den0 = dx1*dy2 - dx2*dy1;
  const g = den0 ? (dx3*dy2 - dx2*dy3) / den0 : 0, h = den0 ? (dx1*dy3 - dx3*dy1) / den0 : 0;
  const a = p1[0]-p0[0]+g*p1[0], b = p3[0]-p0[0]+h*p3[0], c = p0[0];
  const d = p1[1]-p0[1]+g*p1[1], e = p3[1]-p0[1]+h*p3[1], f = p0[1];
  const sw = src.width, sh = src.height;
  const sd = src.getContext('2d').getImageData(0,0,sw,sh).data;
  const out = new ImageData(W, H), od = out.data;
  for (let y = 0; y < H; y++){
    const v = (y+0.5)/H;
    for (let x = 0; x < W; x++){
      const u = (x+0.5)/W, q = g*u + h*v + 1;
      const X = (a*u + b*v + c)/q - 0.5, Y = (d*u + e*v + f)/q - 0.5;
      let x0 = Math.floor(X), y0 = Math.floor(Y);
      const fx = X - x0, fy = Y - y0;
      const xa = clamp(x0,0,sw-1), xb = clamp(x0+1,0,sw-1), ya = clamp(y0,0,sh-1), yb = clamp(y0+1,0,sh-1);
      const i00 = (ya*sw+xa)*4, i10 = (ya*sw+xb)*4, i01 = (yb*sw+xa)*4, i11 = (yb*sw+xb)*4, o = (y*W+x)*4;
      for (let ch = 0; ch < 3; ch++){
        od[o+ch] = (sd[i00+ch]*(1-fx) + sd[i10+ch]*fx)*(1-fy) + (sd[i01+ch]*(1-fx) + sd[i11+ch]*fx)*fy;
      }
      od[o+3] = 255;
    }
  }
  const cv2 = document.createElement('canvas'); cv2.width = W; cv2.height = H;
  cv2.getContext('2d').putImageData(out, 0, 0);
  return cv2;
}

/* ---------- 보정(그림자 제거·선명·흑백) ---------- */
function applyFilter(bc, m){
  const w = bc.width, h = bc.height;
  const o = document.createElement('canvas'); o.width = w; o.height = h;
  const ctx = o.getContext('2d'); ctx.drawImage(bc, 0, 0);
  if (m === 'color') return o;
  const id = ctx.getImageData(0,0,w,h), d = id.data;
  const gray = new Uint8ClampedArray(w*h);
  for (let i = 0; i < w*h; i++) gray[i] = (d[i*4]*77 + d[i*4+1]*151 + d[i*4+2]*28) >> 8;
  const W1 = w+1, I = new Uint32Array(W1*(h+1));
  for (let y = 0; y < h; y++){
    let row = 0;
    for (let x = 0; x < w; x++){ row += gray[y*w+x]; I[(y+1)*W1+x+1] = I[y*W1+x+1] + row; }
  }
  const r = Math.max(8, Math.round(Math.max(w,h)/28));
  const lut = new Uint8ClampedArray(256);
  for (let v = 0; v < 256; v++){
    lut[v] = m === 'bw' ? clamp((v-150)/50, 0, 1)*255 : clamp((v-45)/(228-45), 0, 1)*255;
  }
  for (let y = 0; y < h; y++){
    const y0 = Math.max(0,y-r), y1 = Math.min(h,y+r+1);
    for (let x = 0; x < w; x++){
      const x0 = Math.max(0,x-r), x1 = Math.min(w,x+r+1);
      const sum = I[y1*W1+x1] - I[y0*W1+x1] - I[y1*W1+x0] + I[y0*W1+x0];
      const bg = Math.max(40, sum / ((x1-x0)*(y1-y0)) * 1.08);
      const f = 255 / bg, p = (y*w+x)*4;
      if (m === 'sharp'){
        d[p] = lut[Math.min(255, d[p]*f)|0]; d[p+1] = lut[Math.min(255, d[p+1]*f)|0]; d[p+2] = lut[Math.min(255, d[p+2]*f)|0];
      } else {
        const v = lut[Math.min(255, gray[y*w+x]*f)|0];
        d[p] = d[p+1] = d[p+2] = v;
      }
    }
  }
  ctx.putImageData(id, 0, 0);
  return o;
}
function renderFx(){
  fxResult = applyFilter(base, mode);
  const host = $('#fxHost'); host.innerHTML = ''; host.append(fxResult);
  document.querySelectorAll('#chips .chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.m === mode));
}
function rotate(cvs, dir){
  const o = document.createElement('canvas'); o.width = cvs.height; o.height = cvs.width;
  const x = o.getContext('2d'); x.translate(o.width/2, o.height/2); x.rotate(dir*Math.PI/2);
  x.drawImage(cvs, -cvs.width/2, -cvs.height/2); return o;
}
$('#chips').addEventListener('click', async e => {
  const c = e.target.closest('.chip'); if (!c) return;
  mode = c.dataset.m; toast('보정 중…', 0); await nextFrame(); renderFx(); $('#toast').hidden = true;
});
async function spin(dir){ toast('회전 중…', 0); await nextFrame(); base = rotate(base, dir); renderFx(); $('#toast').hidden = true; }
$('#rotL').onclick = () => spin(-1);
$('#rotR').onclick = () => spin(1);
$('#fxBack').onclick = () => { show('crop'); layoutCrop(); };
$('#fxAdd').onclick = () => {
  const k = 240 / Math.max(fxResult.width, fxResult.height);
  const t = document.createElement('canvas'); t.width = Math.round(fxResult.width*k); t.height = Math.round(fxResult.height*k);
  t.getContext('2d').drawImage(fxResult, 0, 0, t.width, t.height);
  pages.push({canvas: fxResult, thumb: t.toDataURL('image/jpeg', 0.7)});
  renderHome(); show('home'); toast(pages.length + '쪽을 추가했습니다.');
};

/* ---------- 내보내기 ---------- */
let outUrls = [];
$('#toOut').onclick = async () => {
  outUrls.forEach(u => URL.revokeObjectURL(u)); outUrls = [];
  const list = $('#outList'); list.innerHTML = '';
  $('#outCount').textContent = pages.length + ' page' + (pages.length === 1 ? '' : 's');
  show('out');
  for (let i = 0; i < pages.length; i++){
    const blob = await new Promise(r => pages[i].canvas.toBlob(r, 'image/jpeg', 0.9));
    const url = URL.createObjectURL(blob); outUrls.push(url);
    const f = document.createElement('figure'), im = new Image(), cap = document.createElement('figcaption');
    im.src = url; im.alt = (i+1) + '쪽'; cap.textContent = 'P' + (i+1) + ' · ' + pages[i].canvas.width + '×' + pages[i].canvas.height;
    f.append(im, cap); list.append(f);
  }
};
$('#outBack').onclick = () => show('home');
function stamp(){
  const n = new Date(), z = v => String(v).padStart(2,'0');
  return 'scan-' + n.getFullYear() + z(n.getMonth()+1) + z(n.getDate()) + '-' + z(n.getHours()) + z(n.getMinutes());
}
function makePdf(){
  const J = window.jspdf && window.jspdf.jsPDF; if (!J) return null;
  let doc;
  pages.forEach((p,i) => {
    const land = p.canvas.width > p.canvas.height, pw = land ? 297 : 210, ph = land ? 210 : 297, mg = 6;
    if (i === 0) doc = new J({unit:'mm', format:'a4', orientation: land ? 'l' : 'p'});
    else doc.addPage('a4', land ? 'l' : 'p');
    const s = Math.min((pw-2*mg)/p.canvas.width, (ph-2*mg)/p.canvas.height);
    const iw = p.canvas.width*s, ih = p.canvas.height*s;
    doc.addImage(p.canvas.toDataURL('image/jpeg', 0.85), 'JPEG', (pw-iw)/2, (ph-ih)/2, iw, ih);
  });
  return doc.output('blob');
}
$('#pdfBtn').onclick = async () => {
  toast('PDF 만드는 중…', 0); await nextFrame();
  const blob = makePdf();
  if (!blob){ toast('PDF 도구를 불러오지 못했습니다. 이미지를 길게 눌러 저장하세요.', 4000); return; }
  const file = new File([blob], stamp() + '.pdf', {type:'application/pdf'});
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl){
      await dl.save({filename: file.name, data: blob});
      toast('PDF를 저장했습니다.'); return;
    }
  } catch (err) {
    if (err && err.code === 'declined'){ $('#toast').hidden = true; return; }
  }
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file]}); $('#toast').hidden = true; return; }
    catch (err) { if (err && err.name === 'AbortError'){ $('#toast').hidden = true; return; } }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  toast('PDF 저장을 시도했습니다. 저장되지 않으면 아래 이미지를 길게 눌러 저장하세요.', 5000);
};

renderHome();
</script>
